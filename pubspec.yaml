name: yallashop_customer
description: YallaShop Customer App
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  yallashop_core:
    path: ../flutter_shared_package
  flutter_bloc: ^8.1.3
  flutter_secure_storage: ^9.0.0
  go_router: ^14.0.0
  cached_network_image: ^3.3.0
  carousel_slider: ^5.0.0
  google_maps_flutter: ^2.5.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.0
  equatable: ^2.0.5
  video_player: ^2.8.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Tahoma
      fonts:
        - asset: assets/fonts/tahoma.ttf
          weight: 400
        - asset: assets/fonts/tahomabd.ttf
          weight: 700
